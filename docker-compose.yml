version: '3.8'
services:
  server:
    build: ./server
    ports:
      - "3001:3001"
    volumes:
      - ./server/temp:/app/temp
      - ./server/logs:/app/logs
    environment:
      - PORT=3001
      - FRONTEND_URL=http://localhost

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server
